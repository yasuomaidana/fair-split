[package]
name = "fair-split"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Dependency-light scaled-integer arithmetic, half-even rounding, largest-remainder allocation, and balance netting"
readme = "README.md"
keywords = ["fixed-point", "rounding", "allocation", "netting", "arithmetic"]
categories = ["mathematics", "algorithms"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1"
rstest = "0.28"
serde_json = "1"

[features]
default = []
serde = ["dep:serde"]
